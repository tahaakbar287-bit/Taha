<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Taha Akbar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #05080f; color: white; font-family: sans-serif; }
    .glow-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); }
    .modal { backdrop-filter: blur(30px); background: rgba(5,8,15,0.95); }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <nav class="flex justify-between items-center p-6 md:px-10 max-w-6xl mx-auto w-full">
    <div class="tracking-[0.3em] text-xs text-white/60">TAHA AKBAR</div>
    <div class="flex gap-6 text-xs text-white/60">
      <a href="index.html">Home</a>
      <a href="blog.html" class="text-white border-b border-[#0A84FF]">Blog</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="flex-1 max-w-5xl mx-auto px-6 md:px-10 py-10 w-full">
    <h1 class="text-5xl font-bold">Blog & Insights</h1>
    <p class="text-white/40 mt-2 text-sm">Main pic + content + unlimited reference pics — editable from admin</p>

    <div id="blogContainer" class="mt-10 grid md:grid-cols-2 gap-6"></div>
  </div>

  <!-- Blog Detail Modal -->
  <div id="blogModal" class="fixed inset-0 z-[100] hidden overflow-y-auto">
    <div class="modal min-h-screen w-full p-4 md:p-8 flex justify-center">
      <div class="bg-[#0a0e1a] w-full max-w-3xl rounded-[24px] border border-white/10 overflow-hidden">
        <div class="p-4 border-b border-white/10 flex justify-between items-center">
          <b id="modalBlogTitle" class="text-lg"></b>
          <button onclick="closeBlog()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">X</button>
        </div>
        <div class="p-6">
          <img id="modalMainPic" src="" class="w-full h-64 object-cover rounded-xl">
          <p id="modalContent" class="text-white/70 mt-6 leading-relaxed text-sm"></p>
          <h3 class="font-bold mt-8 text-sm">Reference Images</h3>
          <div id="modalRefPics" class="mt-3 grid grid-cols-2 md:grid-cols-3 gap-3"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  function getData() { return JSON.parse(localStorage.getItem('tahaSiteDataV2') || localStorage.getItem('tahaSiteData') || 'null'); }
  let currentData = getData();

  function loadBlogs() {
    const container = document.getElementById('blogContainer');
    if (!currentData || !currentData.blogs || currentData.blogs.length === 0) {
      container.innerHTML = '<p class="text-white/40 text-sm">No blogs yet. Go to admin.html → Blog → Add with main pic and reference pics.</p>';
      return;
    }
    container.innerHTML = currentData.blogs.map((b,i) => `
      <div onclick="openBlog(${i})" class="glow-card rounded-[24px] overflow-hidden cursor-pointer hover:border-[#0A84FF]/50 transition">
        <img src="${b.mainPic || 'https://via.placeholder.com/600x300/0A84FF/ffffff?text=Blog'}" class="w-full h-48 object-cover">
        <div class="p-5">
          <h3 class="font-bold text-sm">${b.title}</h3>
          <p class="text-white/40 text-xs mt-2 line-clamp-2">${(b.content || '').substring(0,100)}...</p>
          <div class="mt-3 flex gap-2">
            <span class="text-[10px] text-white/30">${b.refPics ? b.refPics.length : 0} ref pics</span>
            <span class="text-[10px] text-[#0A84FF]">Read More →</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function openBlog(index) {
    const b = currentData.blogs[index];
    document.getElementById('modalBlogTitle').innerText = b.title;
    document.getElementById('modalMainPic').src = b.mainPic || '';
    document.getElementById('modalContent').innerText = b.content || '';
    document.getElementById('modalRefPics').innerHTML = (b.refPics || []).map(pic => `
      <img src="${pic}" class="w-full h-32 object-cover rounded-xl border border-white/10">
    `).join('') || '<p class="text-white/30 text-xs">No reference pics</p>';
    document.getElementById('blogModal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeBlog() {
    document.getElementById('blogModal').classList.add('hidden');
    document.body.style.overflow = '';
  }

  loadBlogs();
</script>

  <script type="module">
  import { loadData } from './firebase.js';
  
  loadData((data)=>{
    if(!data) return;
    console.log("Firebase data loaded:", data);
    
    // Ye IDs tum apni HTML me laga do jahan data show karna hai
    if(document.getElementById('site-name')) document.getElementById('site-name').innerText = data.name || '';
    if(document.getElementById('site-bio')) document.getElementById('site-bio').innerText = data.bio || '';
    if(document.getElementById('about-text')) document.getElementById('about-text').innerText = data.about || '';
    if(document.getElementById('contact-email')) document.getElementById('contact-email').innerText = data.email || '';
    if(document.getElementById('contact-phone')) document.getElementById('contact-phone').innerText = data.phone || '';
    
    // Projects ke liye
    if(document.getElementById('projects-list') && data.projects){
      let html = "";
      data.projects.forEach(p => {
        html += `<div><h3>${p.title}</h3><p>${p.desc}</p></div>`;
      });
      document.getElementById('projects-list').innerHTML = html;
    }
  });
</script>
</body>
</html>
