<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack — Taha Akbar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&display=swap');
    body { font-family: 'Geist', sans-serif; background: #05080f; color: white; }
    .glow-card { background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(24px); }
    .orb { position: absolute; border-radius: 9999px; filter: blur(70px); opacity: 0.5; }
  </style>
</head>
<body class="flex flex-col min-h-screen relative">
  <div class="orb w-[400px] h-[400px] bg-[#0A84FF]/30 -top-20 -left-20"></div>
  <div class="orb w-[500px] h-[500px] bg-cyan-400/10 top-20 right-0"></div>

  <nav class="relative z-10 flex justify-between items-center px-6 md:px-10 py-6 max-w-[1400px] mx-auto w-full">
    <div class="tracking-[0.3em] text-xs text-white/60">TAHA AKBAR</div>
    <div class="hidden md:flex items-center gap-8 text-sm text-white/60">
      <a href="index.html">Home</a>
      <a href="projects.html">Work</a>
      <a href="about.html">About</a>
      <a href="blog.html" class="text-white border-b border-[#0A84FF]">Stack</a>
      <a href="contact.html">Contact</a>
      <a href="contact.html" class="px-6 py-2.5 rounded-full bg-[#0A84FF] font-bold text-white">Hire Me</a>
    </div>
  </nav>

  <main class="flex-1 relative z-10 max-w-[1100px] mx-auto px-6 md:px-10 w-full">
    <div class="pt-10">
      <h1 class="text-[48px] md:text-[84px] font-extrabold leading-[0.85]">MY<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-[#6A5CFF] via-[#0A84FF] to-cyan-300">STACK & BLOG</span></h1>
      <p class="text-white/40 text-sm mt-4 max-w-[500px]">Tools, tutorials, and breakdowns. All posts use image links from Admin — paste any https:// link or base64 data link.</p>
    </div>

    <div id="blogContainer" class="mt-10 grid md:grid-cols-2 gap-6"></div>

    <div id="emptyBlog" class="hidden mt-20 text-center">
      <div class="glow-card rounded-[24px] p-12 max-w-[500px] mx-auto">
        <i class="fa-solid fa-newspaper text-4xl text-white/20"></i>
        <p class="mt-4 text-white/40 text-sm">No blogs yet. Add from Admin Panel with image link.</p>
      </div>
    </div>
  </main>

  <footer class="relative z-10 border-t border-white/10 mt-20 bg-black/60 backdrop-blur">
    <div class="max-w-[1400px] mx-auto px-6 md:px-10 py-8 flex flex-col md:flex-row justify-between items-center gap-4">
      <div id="footerSocials" class="flex gap-3"></div>
      <p class="text-[11px] text-white/30">© 2026 Taha Akbar — Blog live from Firebase</p>
    </div>
  </footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
  const firebaseConfig={apiKey:"AIzaSyCI7uvdzQPGbmgdf5gz1UEzrELfMbuGkKM",authDomain:"taha-portfolio-82701.firebaseapp.com",databaseURL:"https://taha-portfolio-82701-default-rtdb.firebaseio.com",projectId:"taha-portfolio-82701",storageBucket:"taha-portfolio-82701.firebasestorage.app",messagingSenderId:"41736884999",appId:"1:41736884999:web:8c543d482366d18ac9cbaf"};
  const app=initializeApp(firebaseConfig);const db=getDatabase(app);
  
  onValue(ref(db,'portfolioData'),snap=>{
    const d=snap.val(); if(!d) return;
    const blogs = d.blogs || [];
    
    if(blogs.length===0){
      document.getElementById('emptyBlog').classList.remove('hidden');
    } else {
      document.getElementById('emptyBlog').classList.add('hidden');
      document.getElementById('blogContainer').innerHTML = blogs.map(b=>`
        <div class="glow-card rounded-[24px] overflow-hidden group hover:border-[#0A84FF]/30 transition">
          <div class="h-[200px] bg-white/5 overflow-hidden">
            ${b.mainPic ? `<img src="${b.mainPic}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">` : `<div class="w-full h-full flex items-center justify-center text-white/10"><i class="fa-solid fa-image text-3xl"></i></div>`}
          </div>
          <div class="p-6">
            <div class="flex items-center gap-2 text-[10px] tracking-widest text-white/30"><i class="fa-solid fa-calendar"></i> BLOG • 2026</div>
            <h3 class="font-bold text-[18px] mt-3 leading-tight">${b.title}</h3>
            <p class="text-white/40 text-xs mt-3 line-clamp-3 leading-relaxed">${b.content||''}</p>
            <div class="mt-4 inline-flex px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[10px]">READ MORE →</div>
          </div>
        </div>
      `).join('');
    }
    
    if(d.social){
      document.getElementById('footerSocials').innerHTML = d.social.links.map(s=>`<a href="${s.url}" target="_blank" class="w-10 h-10 rounded-full bg-white/10 hover:bg-[#0A84FF] flex items-center justify-center transition"><i class="fa-brands ${s.icon} text-xs"></i></a>`).join('');
    }
  });
</script>
</body>
</html>
