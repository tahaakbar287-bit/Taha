<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taha Akbar - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#05080f;color:white;font-family:sans-serif}
    .glow-card{background:linear-gradient(180deg,rgba(255,255,255,0.09),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.12)}
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <nav class="flex justify-between p-6 max-w-6xl mx-auto w-full">
    <b>TAHA AKBAR.DEV</b>
    <div class="flex gap-4 text-xs text-white/60">
      <a href="index.html" class="text-white border-b border-[#0A84FF]">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="flex-1 max-w-6xl mx-auto p-6 w-full">
    <div class="glow-card p-8 md:p-12 rounded-[32px]">
      <h1 id="homeTitle" class="text-4xl md:text-6xl font-black">I BUILD CUSTOM SOFTWARE</h1>
      <p id="homeBacklinks" class="text-white/60 mt-6 max-w-2xl text-sm"></p>
      <div class="mt-8 flex gap-6">
        <div><div id="stat1" class="text-2xl font-bold">20+</div><div class="text-[10px] text-white/40">PROJECTS</div></div>
        <div><div id="stat2" class="text-2xl font-bold">100+</div><div class="text-[10px] text-white/40">CLIENTS</div></div>
        <div><div id="stat3" class="text-2xl font-bold">100%</div><div class="text-[10px] text-white/40">SATISFACTION</div></div>
      </div>
    </div>

    <div class="mt-12 flex items-center gap-4">
      <img id="instaProfilePic" class="w-16 h-16 rounded-full object-cover bg-white/10">
      <div>
        <div id="instaName" class="font-bold"></div>
        <div id="instaUsername" class="text-xs text-white/50"></div>
        <div id="instaBio" class="text-xs text-white/60 mt-1"></div>
      </div>
    </div>

    <div id="storyContainer" class="mt-6 flex gap-4 overflow-auto"></div>
    <div id="instaGrid" class="mt-6 grid grid-cols-3 gap-3"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCI7uvdzQPGbmgdf5gz1UEzrELfMbuGkKM",
      authDomain: "taha-portfolio-82701.firebaseapp.com",
      databaseURL: "https://taha-portfolio-82701-default-rtdb.firebaseio.com",
      projectId: "taha-portfolio-82701",
      storageBucket: "taha-portfolio-82701.firebasestorage.app",
      messagingSenderId: "41736884999",
      appId: "1:41736884999:web:8c543d482366d18ac9cbaf"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    onValue(ref(db,'portfolioData'), snap=>{
      const data = snap.val();
      if(!data) return;
      if(data.home){
        document.getElementById('homeTitle').innerText = data.home.title;
        document.getElementById('homeBacklinks').innerText = data.home.backlinks;
        document.getElementById('stat1').innerText = data.home.stats[0];
        document.getElementById('stat2').innerText = data.home.stats[1];
        document.getElementById('stat3').innerText = data.home.stats[2];
      }
      if(data.insta){
        document.getElementById('instaName').innerText = data.insta.name;
        document.getElementById('instaUsername').innerText = '@'+data.insta.username;
        document.getElementById('instaBio').innerText = data.insta.bio;
        if(data.insta.profilePic) document.getElementById('instaProfilePic').src = data.insta.profilePic;
        if(data.insta.stories){
          document.getElementById('storyContainer').innerHTML = data.insta.stories.map(s=>`
            <a href="${s.link||'#'}" class="flex flex-col items-center gap-1 min-w-[60px]">
              <div class="w-14 h-14 rounded-full overflow-hidden bg-white/10">
                ${s.image?`<img src="${s.image}" class="w-full h-full object-cover">`:`<div class="flex items-center justify-center w-full h-full text-xs">${s.label[0]}</div>`}
              </div>
              <span class="text-[10px]">${s.label}</span>
            </a>
          `).join('');
        }
        if(data.insta.grid){
          document.getElementById('instaGrid').innerHTML = data.insta.grid.map(p=>`
            <a href="${p.link||'#'}" class="aspect-square rounded-2xl overflow-hidden bg-white/5 relative">
              ${p.image?`<img src="${p.image}" class="w-full h-full object-cover">`:`<div class="p-2 text-[10px]">${p.name}</div>`}
              <div class="absolute bottom-0 w-full bg-black/60 p-1 text-[9px]">${p.name}</div>
            </a>
          `).join('');
        }
      }
    });
  </script>
</body>
</html>
