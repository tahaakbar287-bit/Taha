<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Taha Akbar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #05080f; color: white; font-family: sans-serif; }
    .glow-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(24px);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <nav class="flex justify-between items-center p-6 md:px-10 max-w-6xl mx-auto w-full">
    <div class="tracking-[0.3em] text-xs text-white/60">TAHA AKBAR</div>
    <div class="flex gap-6 text-xs text-white/60">
      <a href="index.html">Home</a>
      <a href="projects.html" class="text-white border-b border-[#0A84FF]">Work</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="flex-1 max-w-6xl mx-auto px-6 md:px-10 py-10 w-full">
    <h1 class="text-5xl font-bold">Selected Work</h1>
    <p class="text-white/40 mt-2 text-sm">Projects with image, type, link — editable from admin</p>

    <div id="projectsContainer" class="mt-10 grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <footer class="border-t border-white/10 mt-10 py-6 text-center">
    <div id="footerSocials" class="flex justify-center gap-3"></div>
  </footer>

<script>
  function getData() {
    return JSON.parse(localStorage.getItem('tahaSiteDataV2') || localStorage.getItem('tahaSiteData') || 'null');
  }
  const data = getData();
  const container = document.getElementById('projectsContainer');
  
  if (data && data.projects && data.projects.length > 0) {
    container.innerHTML = data.projects.map(p => `
      <a href="${p.link || '#'}" target="_blank" class="glow-card rounded-[24px] overflow-hidden hover:border-[#0A84FF]/50 transition group">
        <div class="h-56 overflow-hidden">
          <img src="${p.image || 'https://via.placeholder.com/400x250/0A84FF/ffffff?text=' + encodeURIComponent(p.name)}" class="w-full h-full object-cover group-hover:scale-105 transition">
        </div>
        <div class="p-5">
          <div class="flex justify-between items-start">
            <h2 class="font-bold text-sm">${p.name}</h2>
            <span class="px-2 py-1 rounded-full bg-[#0A84FF]/20 text-[10px]">${p.type || 'Project'}</span>
          </div>
          <p class="text-white/40 text-xs mt-2">${p.desc || ''}</p>
          <p class="text-[#0A84FF] text-[11px] mt-3">View Project →</p>
        </div>
      </a>
    `).join('');
  } else {
    container.innerHTML = '<p class="text-white/40 text-sm col-span-3">No projects yet. Go to admin.html → Projects → Add Project with image, name, type, link.</p>';
  }

  // Footer
  if (data) {
    const socials = data.social.links || [];
    document.getElementById('footerSocials').innerHTML = socials.map(s => `
      <a href="${s.url}" target="_blank" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
        <i class="fa-brands ${s.icon} text-xs"></i>
      </a>
    `).join('');
  }
</script>
  <script type="module">
  import { loadData } from './firebase.js';
  
  loadData((data)=>{
    if(!data) return;
    console.log("Firebase data loaded:", data);
    
    // Ye IDs tum apni HTML me laga do jahan data show karna hai
    if(document.getElementById('site-name')) document.getElementById('site-name').innerText = data.name || '';
    if(document.getElementById('site-bio')) document.getElementById('site-bio').innerText = data.bio || '';
    if(document.getElementById('about-text')) document.getElementById('about-text').innerText = data.about || '';
    if(document.getElementById('contact-email')) document.getElementById('contact-email').innerText = data.email || '';
    if(document.getElementById('contact-phone')) document.getElementById('contact-phone').innerText = data.phone || '';
    
    // Projects ke liye
    if(document.getElementById('projects-list') && data.projects){
      let html = "";
      data.projects.forEach(p => {
        html += `<div><h3>${p.title}</h3><p>${p.desc}</p></div>`;
      });
      document.getElementById('projects-list').innerHTML = html;
    }
  });
</script>
</body>
</html>
